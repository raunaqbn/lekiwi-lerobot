<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lekiwi-system-explained — HyperFrames Player</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #0a0a0a;
        color: #fff;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .player-wrap {
        width: 100%;
        max-width: 1280px;
        aspect-ratio: 16/9;
        border-radius: 8px;
        overflow: hidden;
      }
      hyperframes-player {
        width: 100%;
        height: 100%;
      }
      .info {
        margin-top: 16px;
        font-size: 12px;
        color: #444;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <div class="player-wrap">
      <hyperframes-player
        src="./composition/index.html"
        controls
      ></hyperframes-player>
    </div>
    <div class="info">lekiwi-system-explained — hyperframes play</div>
    <script src="./player.js"></script>
  </body>
</html>
