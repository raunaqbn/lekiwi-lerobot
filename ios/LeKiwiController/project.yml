name: LeKiwiController
options:
  bundleIdPrefix: com.raunaqnaidu
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: L6YHMZPSYT
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: true
targets:
  LeKiwiController:
    type: application
    platform: iOS
    sources:
      - path: LeKiwiController
        excludes:
          - Resources/Twin
          - Resources/AppIconSource.svg
      - path: LeKiwiController/Resources/Twin
        type: folder
        buildPhase: resources
      - path: ../../src/lerobot/robots/lekiwi/static/lekiwi_3d.bundle.js
        buildPhase: resources
      - path: ../../src/lerobot/robots/lekiwi/static/models
        type: folder
        buildPhase: resources
    info:
      path: LeKiwiController/Info.plist
      properties:
        CFBundleDisplayName: LeKiwi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.raunaqnaidu.lekiwi.cloudflare-access
            CFBundleURLSchemes:
              - com.raunaqnaidu.lekiwi
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSLocalNetworkUsageDescription: LeKiwi connects to your robot gateway to show its cameras and safely send drive commands.
        NSBonjourServices:
          - _lekiwi._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raunaqnaidu.lekiwi
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "6"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
    scheme:
      testTargets:
        - LeKiwiControllerTests
  LeKiwiControllerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LeKiwiControllerTests
    dependencies:
      - target: LeKiwiController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raunaqnaidu.lekiwi.tests
        GENERATE_INFOPLIST_FILE: true
