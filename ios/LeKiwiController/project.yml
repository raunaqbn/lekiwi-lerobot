name: LeKiwiController
options:
  bundleIdPrefix: io.lekiwi
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: true
targets:
  LeKiwiController:
    type: application
    platform: iOS
    sources:
      - path: LeKiwiController
        excludes:
          - Resources/Twin
          - Resources/AppIconSource.svg
      - path: LeKiwiController/Resources/Twin
        type: folder
        buildPhase: resources
      - path: ../../src/lerobot/robots/lekiwi/static/lekiwi_3d.bundle.js
        buildPhase: resources
      - path: ../../src/lerobot/robots/lekiwi/static/models
        type: folder
        buildPhase: resources
    info:
      path: LeKiwiController/Info.plist
      properties:
        CFBundleDisplayName: LeKiwi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: io.lekiwi.controller.cloudflare-access
            CFBundleURLSchemes:
              - io.lekiwi.controller
        LeKiwiBaseURL: https://robot.example.com
        LeKiwiCallbackScheme: io.lekiwi.controller
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSLocalNetworkUsageDescription: LeKiwi connects to your robot gateway to show its cameras and safely send drive commands.
        NSBonjourServices:
          - _lekiwi._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.lekiwi.controller
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
    scheme:
      testTargets:
        - LeKiwiControllerTests
  LeKiwiControllerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LeKiwiControllerTests
    dependencies:
      - target: LeKiwiController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.lekiwi.controller.tests
        GENERATE_INFOPLIST_FILE: true
